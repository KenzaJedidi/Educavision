services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $projectDir: '%kernel.project_dir%'
            $geminiApiKey: '%env(GEMINI_API_KEY)%'
            $openaiApiKey: '%env(default::OPENAI_API_KEY)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Configuration explicite pour SummarizationService
    App\Service\SummarizationService:
        public: true

    # EmailService with sender configuration from env
    App\Service\EmailService:
        public: true
        arguments:
            $fromAddress: '%env(MAILER_FROM_ADDRESS)%'
            $fromName: '%env(MAILER_FROM_NAME)%'

    # Configuration explicite pour SentimentService
    App\Service\SentimentService:
        public: true

    # Configuration explicite pour ResolutionPredictionService
    App\Service\ResolutionPredictionService:
        public: true

    # Services pour les Chapitres
    App\Service\ChapterAIMockService:
        public: true
    
    App\Service\ChapterAIService:
        public: true
        arguments:
            $geminiApiKey: '%env(GEMINI_API_KEY)%'

    App\Service\ChapterTranslationService:
        public: true

    App\Service\ChapterService:
        public: true

    # Services pour les Quiz
    App\Service\QuizAIMockService:
        public: true

    App\Service\QuizService:
        public: true

    # Service OpenAI avec cache
    App\Service\OpenAICourseService:
        public: true
        autowire: true
        arguments:
            $cache: '@cache.system'
            $openaiApiKey: '%env(default::OPENAI_API_KEY)%'

    # DeepSeek API pour génération de quiz IA
    App\Service\AI\DeepSeekApiService:
        public: true
        arguments:
            $apiKey: '%env(default::DEEPSEEK_API_KEY)%'

    # Configuration pour les contrôleurs
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones